<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>heart.PROTOCOL_v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050206;--pink:#ff4d79;--red:#ff1f4b;--green:#3dff6b;--dim:#9a8f98;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:var(--mono);overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#14060d 0%,var(--bg) 70%)}

#term{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;gap:14px;font-size:13px;line-height:1.7;
  transition:opacity .7s ease,transform .7s ease}
#term.gone{opacity:0;transform:translateY(-10px);pointer-events:none}
#msg{color:#ffb3c6;font-style:italic;font-size:15px;line-height:1.9;min-height:5.7em}
.caret::after{content:"▍";color:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#go{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;margin-top:6px;
  font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pink);
  background:rgba(255,45,85,.08);border:1px solid rgba(255,77,121,.55);padding:14px 18px;cursor:pointer;
  opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .5s,transform .5s,box-shadow .25s,background .25s}
#go.show{opacity:1;transform:none;pointer-events:auto}
#go:hover,#go:focus-visible{background:rgba(255,45,85,.16);box-shadow:0 0 18px rgba(255,45,85,.45);outline:none}
#go:active{transform:scale(.97)}
#go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
#hint{font-size:10px;color:#5b5159;opacity:0;transition:opacity .8s .3s}
#hint.show{opacity:1}

#snd{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:5;display:none;
  font:700 11px/1 var(--mono);color:var(--pink);background:rgba(255,45,85,.08);
  border:1px solid rgba(255,77,121,.45);padding:10px 12px;cursor:pointer}
#snd.on{display:block}#snd.off{color:#6b5a62;border-color:#3a2d33}
#c{position:fixed;inset:0;width:100%;height:100%;display:none;cursor:pointer}
#c.on{display:block}

@media (prefers-reduced-motion:reduce){.caret::after{animation:none}#term,#go{transition:none}}
</style>
</head>
<body>

<main id="term">
  <div id="msg" class="caret"></div>
  <button id="go" type="button" aria-label="Decrypt message">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Decrypt message
  </button>
  <div id="hint">[ tap to open ]</div>
</main>

<audio id="bgm" src="heart-music.m4a" preload="auto"></audio>
<button id="snd" type="button" aria-label="Toggle music">♪ ON</button>
<canvas id="c" aria-label="A heart made of the words i love you"></canvas>

<script>
(() => {
'use strict';

const PHRASE  = 'i love you';
const REVEAL  = 'DECRYPTED';
const CAPTION = 'Happiest second anniversary to us, Mahal ko.';
const COUNT   = 1;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function type(el, text, speed = 26) {
  if (reduce) { el.textContent = text; return; }
  for (const ch of text) { el.textContent += ch; await sleep(speed); }
}
async function boot() {
  const msg = $('#msg');
  await sleep(600);
  await type(msg, "I might be a little intense sometimes, but just you know, Hasan, my dearest, dear darling, forever is not enough for me to love you so...", 34);
  msg.classList.remove('caret');
  await sleep(600);
  $('#go').classList.add('show'); $('#hint').classList.add('show');
}
boot();

const bgm = $('#bgm'), snd = $('#snd');
let muted = false;
function playMusic() {
  bgm.volume = 0;
  const p = bgm.play();
  if (p) p.catch(() => {});
  let v = 0;
  const f = setInterval(() => { v = Math.min(.8, v + .05); bgm.volume = muted ? 0 : v; if (v >= .8) clearInterval(f); }, 120);
  snd.classList.add('on');
}
snd.addEventListener('click', () => {
  muted = !muted;
  bgm.volume = muted ? 0 : .8;
  snd.textContent = muted ? '♪ OFF' : '♪ ON';
  snd.classList.toggle('off', muted);
});

const cv = $('#c'), ctx = cv.getContext('2d');
const MONO = "'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace";
let W = 0, H = 0, parts = [], t0 = 0, raf = 0, running = false;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

const heart = t => [
  16 * Math.pow(Math.sin(t), 3),
  -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
];

function build() {
  parts = [];
  const layers = 10;
  for (let L = 0; L < layers; L++) {
    const s = 1 - L * 0.095;
    const n = Math.round((16 + 95 * s) * COUNT);
    for (let i = 0; i < n; i++) {
      const [x, y] = heart((i / n) * Math.PI * 2 + Math.random() * 0.05);
      const a = Math.random() * Math.PI * 2;
      parts.push({
        nx: x * s + (Math.random() - .5) * .5,
        ny: y * s + (Math.random() - .5) * .5,
        fx: .5 + Math.cos(a) * .95, fy: .5 + Math.sin(a) * .95,
        d: reduce ? 0 : Math.random() * 1.8,
        dur: reduce ? .01 : 1.3 + Math.random() * .9,
        al: .35 + Math.random() * .65,
        ph: Math.random() * 6.28,
        sz: .85 + Math.random() * .5
      });
    }
  }
}

function frame(ts) {
  if (!running) return;
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;
  const u = Math.min(W / 36, H * .62 / 30);
  const cx = W / 2, cy = H * .47 - 2.5 * u;
  const done = t > 3.4;
  const beat = done ? 1 + .035 * Math.pow(Math.max(0, Math.sin(t * 2.6)), 8) : 1;
  const fs = Math.max(8, Math.min(15, u * .5));

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,2,6,.3)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,31,75,.9)'; ctx.shadowBlur = 5;
  for (const p of parts) {
    const k = Math.max(0, Math.min(1, (t - p.d) / p.dur));
    if (k === 0) continue;
    const e = 1 - Math.pow(1 - k, 3);
    const tx = cx + p.nx * u * beat + (k === 1 ? Math.sin(t * 1.6 + p.ph) * 1.2 : 0);
    const ty = cy + p.ny * u * beat + (k === 1 ? Math.cos(t * 1.3 + p.ph) * 1.2 : 0);
    const x = p.fx * W + (tx - p.fx * W) * e;
    const y = p.fy * H + (ty - p.fy * H) * e;
    ctx.font = `italic ${(fs * p.sz).toFixed(1)}px ${MONO}`;
    ctx.fillStyle = `rgba(255,${40 + Math.round(p.al * 30)},${75 + Math.round(p.al * 20)},${(p.al * (.25 + .75 * e)).toFixed(2)})`;
    ctx.fillText(PHRASE, x, y);
  }

  const ra = t < 2.2 ? 0 : t < 2.8 ? (t - 2.2) / .6 : t < 4.2 ? 1 : Math.max(0, 1 - (t - 4.2) / .8);
  if (ra > 0) {
    ctx.font = `700 ${Math.max(13, u * .9)}px ${MONO}`;
    ctx.shadowBlur = 14; ctx.fillStyle = `rgba(255,120,150,${ra})`;
    ctx.fillText(REVEAL, cx, cy + 2.5 * u);
  }

  if (CAPTION && t > 4.4) {
    const ca = Math.min(1, (t - 4.4) / 1.2);
    ctx.font = `italic 400 ${Math.max(11, Math.min(16, u * .6))}px ${MONO}`;
    ctx.shadowBlur = 8; ctx.fillStyle = `rgba(255,170,190,${ca})`;
    ctx.fillText(CAPTION, cx, cy + 20.5 * u);
  }
  ctx.shadowBlur = 0;
  raf = requestAnimationFrame(frame);
}

function start() {
  cancelAnimationFrame(raf);
  resize(); build();
  ctx.fillStyle = '#050206'; ctx.fillRect(0, 0, W, H);
  cv.classList.add('on');
  t0 = 0; running = true;
  if (bgm.paused && !muted) playMusic();
  raf = requestAnimationFrame(frame);
}

$('#go').addEventListener('click', () => {
  $('#go').disabled = true;
  playMusic();
  if (navigator.vibrate) navigator.vibrate([60, 90, 60]);
  $('#term').classList.add('gone');
  setTimeout(start, reduce ? 0 : 450);
});

cv.addEventListener('click', () => { if (running && (performance.now() - (t0 || 0)) > 0 && t0 && (performance.now() - t0) / 1000 > 6) start(); });
})();
</script>
</body>
</html>
